<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Luxury Gold Gradient Accent -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    
    <!-- Dark Background Gradient -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#171717" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#darkBg)" />
  
  <!-- Outer Watch Bezel Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#262626" stroke-width="12" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#goldAccent)" stroke-width="4" opacity="0.6" />

  <!-- Watch Minute Markers (Ticks) -->
  <g stroke="#525252" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="62" x2="256" y2="78" />
    <line x1="256" y1="434" x2="256" y2="450" />
    <line x1="62" y1="256" x2="78" y2="256" />
    <line x1="434" y1="256" x2="450" y2="256" />
  </g>

  <!-- Monogram 'RW' Typography -->
  <text x="256" y="292" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="900" 
        font-size="160" 
        fill="#FFFFFF" 
        letter-spacing="-4"
        text-anchor="middle">RW</text>

  <!-- Luxury Accent Dot / Watch Pin -->
  <circle cx="256" cy="336" r="8" fill="url(#goldAccent)" />
</svg>
